name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"


jobs:

  # =====================================================
  # 1. BUILD + TEST + LINT (Matrix)
  # =====================================================
  build:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    env:
      # Force Go 1.24 runners to auto-upgrade the toolchain to 1.25 while keeping 1.25 native runs unchanged
      GOTOOLCHAIN: go1.25.0

    strategy:
      fail-fast: false
      matrix:
        go: ["1.24","1.25"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cache-${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-cache-${{ runner.os }}-${{ matrix.go }}-
            go-cache-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go mod tidy consistency
        run: |
          go mod tidy
          git diff --exit-code || (echo "❌ go mod tidy produced changes"; exit 1)

          

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ gofmt check failed:"
            gofmt -l .
            exit 1
          fi

      - name: Lint (golangci-lint)
        run: |
          # Using the official install script
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.6.2
          golangci-lint run --timeout=5m

      - name: Vulnerability scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ matrix.go }}

      - name: Verify fit-for-purpose plan present
        run: test -f docs/fit_for_purpose.poml

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Enforce coverage ≥80%
        run: |
          THRESHOLD=80.0
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          RESULT=$(printf "%.2f" "$TOTAL")
          echo "Coverage: $RESULT% (threshold: $THRESHOLD%)"
          if ! awk "BEGIN {exit ($RESULT < $THRESHOLD ? 1 : 0)}"; then
            echo "❌ Coverage $RESULT% below threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # =====================================================
  # 2. E2E TESTS (Docker Matrix)
  # =====================================================
  e2e:
    name: POML Semantic E2E (Docker Matrix)
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        base: ["debian:stable", "alpine:3.20", "ubuntu:24.04"]
        arch: ["amd64", "arm64"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          TAG=$(echo "${{ matrix.base }}" | tr ':' '-')
          ARCH="${{ matrix.arch }}"
          BASE="${{ matrix.base }}"
          cat <<'EOF' > Dockerfile
          ARG BASE_IMAGE=alpine:3.20
          FROM ${BASE_IMAGE}

          ARG GO_VERSION=1.25.4
          # Ensure curl/tar/git are available for Go install across alpine/apt-based images.
          RUN (apk add --no-cache curl tar git ca-certificates || \
               (apt-get update && apt-get install -y curl ca-certificates tar git)) && \
              update-ca-certificates || true
          RUN case "$(uname -s)" in \
                Linux) ;; \
                *) echo "unsupported OS"; exit 1 ;; \
              esac && \
              arch=$(uname -m) && \
              case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; armv7l) arch=armv6l ;; esac && \
              url="https://go.dev/dl/go${GO_VERSION}.linux-${arch}.tar.gz" && \
              curl -sSfL "$url" -o /tmp/go.tgz && \
              rm -rf /usr/local/go && \
              tar -C /usr/local -xzf /tmp/go.tgz && \
              ln -sf /usr/local/go/bin/go /usr/bin/go

          # (Keep system Go if present for tools, but we rely on downloaded Go above.)
          RUN apk add --no-cache go || (apt-get update && apt-get install -y golang) || true

          WORKDIR /sdk
          COPY . .

          RUN cat <<'EOT' > semantic_test.go
          package main

          import (
            "os"
            "path/filepath"
            "fmt"
            sdk "github.com/atlas-foundry/poml-go-sdk"
          )

          func main() {
            files := []string{}
            filepath.Walk("poml/testdata", func(path string, info os.FileInfo, err error) error {
              if err == nil && !info.IsDir() && filepath.Ext(path) == ".poml" {
                files = append(files, path)
              }
              return nil
            })

            if len(files) == 0 {
              panic("no .poml test files found")
            }

            for _, f := range files {
              data, _ := os.ReadFile(f)
              doc, err := sdk.ParseString(string(data))
              if err != nil {
                panic(fmt.Sprintf("parse error in %s: %v", f, err))
              }
              if err := sdk.Validate(doc); err != nil {
                panic(fmt.Sprintf("semantic error in %s: %v", f, err))
              }
              opts := sdk.ConvertOptions{BaseDir: filepath.Dir(f), MaxImageBytes: 10 << 20, MaxMediaBytes: 10 << 20}
              if _, err := sdk.Convert(doc, sdk.FormatMessageDict, opts); err != nil {
                panic(fmt.Sprintf("convert error in %s: %v", f, err))
              }
            }

            println("OK")
          }
          EOT

          ENV PATH=/usr/local/go/bin:$PATH
          RUN go version && go build semantic_test.go
          EOF

          docker buildx build --platform=linux/${ARCH} --build-arg BASE_IMAGE="${BASE}" --build-arg GO_VERSION="1.25.4" -t poml-e2e:${TAG}-${ARCH} .

      - name: Run E2E Test
        run: |
          TAG=$(echo "${{ matrix.base }}" | tr ':' '-')
          docker run --rm --platform=linux/${{ matrix.arch }} poml-e2e:${TAG}-${{ matrix.arch }}

  # =====================================================
  # 2b. MACOS TESTS (Apple Silicon)
  # =====================================================
  macos:
    name: macOS Build & Test (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ gofmt check failed:"
            gofmt -l .
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  # =====================================================
  # 2c. WINDOWS TESTS
  # =====================================================
  windows:
    name: Windows Build & Test
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ gofmt check failed:"
            gofmt -l .
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  # =====================================================
  # 3. DOCS BUILD
  # =====================================================
  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MDX
        run: npm install @mdx-js/mdx@3 --no-save

      - name: Generate docs
        run: |
          mkdir -p build/docs
          npx @mdx-js/mdx README.mdx > build/docs/index.html

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poml-docs
          path: build/docs

  # =====================================================
  # 4. NIGHTLY DOCS
  # =====================================================
  nightly_docs:
    name: Nightly Docs Rebuild
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p nightly/docs
          mdx README.mdx > nightly/docs/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-docs
          path: nightly/docs

  # =====================================================
  # 5. SEMANTIC RELEASE
  # =====================================================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [build, e2e, docs]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install semantic-release
        run: |
          npm install -g semantic-release@23 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10.0.1 \
            @semantic-release/github@9 \
            @semantic-release/commit-analyzer@11 \
            @semantic-release/release-notes-generator@12

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

  # =====================================================
  # 6. RELEASE BINARIES
  # =====================================================
  release_binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        run: |
          mkdir dist
          GOOS=linux   GOARCH=amd64 go build -o dist/poml-go-sdk-linux-amd64   .
          GOOS=darwin  GOARCH=arm64 go build -o dist/poml-go-sdk-macos-arm64   .
          GOOS=windows GOARCH=amd64 go build -o dist/poml-go-sdk-windows-amd64.exe .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
